[project]
name = "geopricing"
version = "0.1.0"
description = "GeoIP-based localized pricing, currency conversion, and purchasing power parity (PPP) engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geopricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
